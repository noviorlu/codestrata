[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codestrata"
version = "0.1.0"
description = "Two graphs for a Python repo: a static architecture map, and a runtime hot path overlaid on it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []            # 标准库为主

[project.optional-dependencies]
highlight = ["Pygments>=2.17"]   # 源码高亮，可选

[project.scripts]
codestrata = "codestrata.__main__:main"

[tool.setuptools.packages.find]
include = ["codestrata*"]
