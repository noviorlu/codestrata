[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codestrata"
version = "0.1.0"
description = "Run-path tool for a repository: record one real run and see which path it took through a large codebase, per process and thread, on top of a static call graph."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []            # 标准库为主
keywords = ["call graph", "tracing", "code navigation", "multiprocessing", "sys.monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/noviorlu/codestrata"
Documentation = "https://github.com/noviorlu/codestrata/blob/master/docs/usage.md"
Issues = "https://github.com/noviorlu/codestrata/issues"

[project.optional-dependencies]
highlight = ["Pygments>=2.17"]   # 源码高亮，可选
native = ["tree-sitter>=0.26", "tree-sitter-cuda>=0.21"]   # C / C++ / CUDA 文件进图（CUDA 语法也认普通 C++）

[project.scripts]
codestrata = "codestrata.__main__:main"

[tool.setuptools.packages.find]
include = ["codestrata*"]

# 前端（index.html、主菜单、JS / CSS）是包的一部分：不写这个，非 -e 的安装里没有它们，
# serve 每个页面都 404
[tool.setuptools.package-data]
codestrata = ["web/*", "trace/*.cpp"]   # trace/cupti_inject.cpp：trace --gpu 录的时候现编
