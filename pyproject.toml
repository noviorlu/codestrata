[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codestrata"
version = "0.1.0"
description = "Two graphs for a Python repo: a static architecture map, and a runtime hot path overlaid on it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []            # 标准库为主

[project.optional-dependencies]
highlight = ["Pygments>=2.17"]   # 源码高亮，可选
native = ["tree-sitter>=0.26", "tree-sitter-cuda>=0.21"]   # C / C++ / CUDA 文件进图（CUDA 语法也认普通 C++）

[project.scripts]
codestrata = "codestrata.__main__:main"

[tool.setuptools.packages.find]
include = ["codestrata*"]

# 前端（index.html、主菜单、JS / CSS）是包的一部分：不写这个，非 -e 的安装里没有它们，
# serve 每个页面都 404
[tool.setuptools.package-data]
codestrata = ["web/*", "trace/*.cpp"]   # trace/cupti_inject.cpp：trace --gpu 录的时候现编
